# 绿智管家 API 规范 (OpenAPI 3.0)
# 导入 Apifox: 新建项目 → 设置 → 数据管理 → 导入数据 → 选 OpenAPI/Swagger → 选本文件
# 对齐: plan_v2_完善版.docx §5 API接口设计概览
# 维护: 成员3 (数据分析与测试工程师)

openapi: 3.0.3
info:
  title: 绿智管家 API
  version: 1.0.0
  description: |
    室内绿植智能培育管理系统 RESTful API。
    统一响应格式: `{ "code": 200, "message": "success", "data": {...} }`
    认证方式: JWT,Header 携带 `Authorization: Bearer <token>`
servers:
  - url: http://localhost:8080/api/v1
    description: 本地开发环境
  - url: '{{base_url}}{{api_prefix}}'
    description: Apifox 环境变量(需在环境中定义 base_url / api_prefix)

# ==================== 安全方案 ====================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ==================== 统一响应包装 ====================
  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          description: 业务状态码(200成功, 4xx/5xx错误, 1001+业务码)
          example: 200
        message:
          type: string
          example: success
        data:
          description: 业务数据(具体结构见各接口)
      required: [code, message]

    PageResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        data:
          type: object
          properties:
            records:
              type: array
              items: {}
            total:
              type: integer
              example: 100
            size:
              type: integer
              example: 10
            current:
              type: integer
              example: 1

    # ==================== 用户 ====================
    UserRegisterRequest:
      type: object
      properties:
        username:
          type: string
          example: tester01
        password:
          type: string
          format: password
          example: Test@1234
        nickname:
          type: string
          example: 测试员
        email:
          type: string
          format: email
          example: tester@greenwise.com
      required: [username, password]

    UserLoginRequest:
      type: object
      properties:
        username:
          type: string
          example: tester01
        password:
          type: string
          format: password
          example: Test@1234
      required: [username, password]

    LoginResult:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9.payload.signature
        userId:
          type: integer
          example: 1
        username:
          type: string
          example: tester01

    UserInfo:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: tester01
        nickname:
          type: string
          example: 测试员
        email:
          type: string
          example: tester@greenwise.com
        phone:
          type: string
          example: "13800138000"
        avatar:
          type: string
          example: ""
        status:
          type: integer
          description: 1启用 0禁用
          example: 1

    # ==================== 植物 ====================
    PlantRequest:
      type: object
      properties:
        plantName:
          type: string
          example: 阳台绿萝
        species:
          type: string
          example: 绿萝
        imageUrl:
          type: string
          example: ""
        location:
          type: string
          example: 阳台东南角
        tempMin:
          type: number
          format: float
          example: 18.0
        tempMax:
          type: number
          format: float
          example: 28.0
        humidityMin:
          type: number
          format: float
          example: 40.0
        humidityMax:
          type: number
          format: float
          example: 70.0
        lightMin:
          type: number
          example: 3000
        lightMax:
          type: number
          example: 15000
        soilMoistureMin:
          type: number
          format: float
          example: 40.0
        soilMoistureMax:
          type: number
          format: float
          example: 70.0
      required: [plantName]

    PlantInfo:
      allOf:
        - $ref: '#/components/schemas/PlantRequest'
        - type: object
          properties:
            id:
              type: integer
              example: 1
            userId:
              type: integer
              example: 1
            status:
              type: integer
              example: 1
            createTime:
              type: string
              format: date-time
              example: 2026-07-14 15:30:00

    # ==================== 环境数据 (成员3重点) ====================
    EnvDataRequest:
      type: object
      description: 对齐数据库 env_data 表 (plan_v2 §4.2.3)
      properties:
        plantId:
          type: integer
          example: 1
        temperature:
          type: number
          format: float
          description: 温度(℃) DECIMAL(5,2)
          example: 24.35
        humidity:
          type: number
          format: float
          description: 空气湿度(%) DECIMAL(5,2)
          example: 55.20
        lightIntensity:
          type: number
          format: float
          description: 光照强度(Lux) DECIMAL(8,2)
          example: 8200.00
        soilMoisture:
          type: number
          format: float
          description: 土壤湿度(%) DECIMAL(5,2)
          example: 58.10
        recordTime:
          type: string
          format: date-time
          description: 数据记录时间
          example: 2026-07-14 15:30:00
        dataSource:
          type: string
          description: 数据来源 SIMULATION/MQTT/MANUAL
          default: SIMULATION
          example: SIMULATION
      required: [plantId, temperature, humidity, lightIntensity, soilMoisture, recordTime]

    EnvDataBatchRequest:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/EnvDataRequest'
          example:
            - plantId: 1
              temperature: 24.35
              humidity: 55.20
              lightIntensity: 8200.00
              soilMoisture: 58.10
              recordTime: "2026-07-14 15:30:00"
              dataSource: SIMULATION

    EnvDataRecord:
      allOf:
        - $ref: '#/components/schemas/EnvDataRequest'
        - type: object
          properties:
            id:
              type: integer
              example: 10001
            createTime:
              type: string
              format: date-time
              example: 2026-07-14 15:30:05

    # ==================== 健康分析 ====================
    HealthScore:
      type: object
      properties:
        plantId:
          type: integer
          example: 1
        healthScore:
          type: integer
          minimum: 0
          maximum: 100
          example: 85
        tempStatus:
          type: string
          example: 正常
        humidityStatus:
          type: string
          example: 正常
        lightStatus:
          type: string
          example: 正常
        soilStatus:
          type: string
          example: 正常
        alertLevel:
          type: string
          enum: [NORMAL, WARNING, DANGER]
          example: NORMAL

    HealthReport:
      allOf:
        - $ref: '#/components/schemas/HealthScore'
        - type: object
          properties:
            suggestion:
              type: string
              description: 养护建议(JSON格式字符串, 见 health_scoring_rules.md §6)
              example: '{"summary":"当前环境条件良好,继续保持现有养护节奏。"}'
            analysisTime:
              type: string
              format: date-time
              example: 2026-07-14 15:30:00

    # ==================== Dashboard ====================
    DashboardSummary:
      type: object
      properties:
        plantCount:
          type: integer
          example: 3
        avgHealthScore:
          type: integer
          example: 82
        warningCount:
          type: integer
          example: 1
        dangerCount:
          type: integer
          example: 0
        latestEnvData:
          type: array
          items:
            $ref: '#/components/schemas/EnvDataRecord'

  # ==================== 请求/响应复用 ====================
  responses:
    Unauthorized:
      description: 未登录或Token已过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 401
            message: 未登录或Token已过期
            data: null
    BadRequest:
      description: 请求参数校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 400
            message: 参数校验失败
            data: null

# ==================== 接口分组标签 ====================
tags:
  - name: 用户
    description: 用户注册/登录/信息管理
  - name: 植物
    description: 植物档案 CRUD
  - name: 环境数据
    description: 环境数据上传与查询 (成员3重点对接)
  - name: 健康分析
    description: AI 健康评分与报告
  - name: Dashboard
    description: 首页汇总与趋势

# ==================== 接口定义 ====================
paths:
  # ---------- 用户 ----------
  /user/register:
    post:
      tags: [用户]
      summary: 用户注册
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 200
                message: success
                data: { userId: 1 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '1001':
          description: 用户名已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 1001
                message: 用户名已存在
                data: null

  /user/login:
    post:
      tags: [用户]
      summary: 用户登录,返回JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResult'
              example:
                code: 200
                message: success
                data:
                  token: eyJhbGciOiJIUzI1NiJ9.payload.signature
                  userId: 1
                  username: tester01
        '1002':
          description: 用户名或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 1002
                message: 用户名或密码错误
                data: null

  /user/info:
    get:
      tags: [用户]
      summary: 获取当前用户信息
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [用户]
      summary: 更新用户信息
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInfo'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ---------- 植物 ----------
  /plant:
    post:
      tags: [植物]
      summary: 添加植物档案
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantRequest'
      responses:
        '200':
          description: 添加成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1

  /plant/list:
    get:
      tags: [植物]
      summary: 获取用户的植物列表
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PlantInfo'

  /plant/{id}:
    get:
      tags: [植物]
      summary: 获取植物详情
      security: [{BearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PlantInfo'
        '2001':
          description: 植物档案不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 2001
                message: 植物档案不存在
                data: null
    put:
      tags: [植物]
      summary: 更新植物信息
      security: [{BearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags: [植物]
      summary: 删除植物档案
      security: [{BearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ---------- 环境数据 (成员3重点) ----------
  /env-data:
    post:
      tags: [环境数据]
      summary: 上传环境数据(单条)
      description: |
        成员3 数据模拟器 data_simulator.py 的主对接接口。
        字段对齐 env_data 表 (plan_v2 §4.2.3)。
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvDataRequest'
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 10001
        '3001':
          description: 环境数据格式校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 3001
                message: 环境数据格式校验失败
                data: null

  /env-data/batch:
    post:
      tags: [环境数据]
      summary: 批量上传环境数据
      description: |
        成员3 历史数据批量灌入接口。
        data_simulator.py --history N --submit 调用此接口。
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvDataBatchRequest'
      responses:
        '200':
          description: 批量上传成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          insertedCount:
                            type: integer
                            example: 336

  /env-data/{plantId}:
    get:
      tags: [环境数据]
      summary: 查询环境数据(分页+时间范围)
      security: [{BearerAuth: []}]
      parameters:
        - name: plantId
          in: path
          required: true
          schema:
            type: integer
        - name: startTime
          in: query
          required: false
          schema:
            type: string
            format: date-time
          example: 2026-07-07 00:00:00
        - name: endTime
          in: query
          required: false
          schema:
            type: string
            format: date-time
          example: 2026-07-14 23:59:59
        - name: current
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - type: object
                    properties:
                      data:
                        properties:
                          records:
                            type: array
                            items:
                              $ref: '#/components/schemas/EnvDataRecord'

  /env-data/{plantId}/latest:
    get:
      tags: [环境数据]
      summary: 获取植物最新环境数据
      security: [{BearerAuth: []}]
      parameters:
        - name: plantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EnvDataRecord'

  # ---------- 健康分析 ----------
  /health/{plantId}/score:
    get:
      tags: [健康分析]
      summary: 获取植物健康评分
      security: [{BearerAuth: []}]
      parameters:
        - name: plantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthScore'

  /health/{plantId}/report:
    get:
      tags: [健康分析]
      summary: 获取完整健康报告
      security: [{BearerAuth: []}]
      parameters:
        - name: plantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthReport'

  /health/{plantId}/history:
    get:
      tags: [健康分析]
      summary: 获取健康评分历史
      security: [{BearerAuth: []}]
      parameters:
        - name: plantId
          in: path
          required: true
          schema:
            type: integer
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 7
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            healthScore:
                              type: integer
                            analysisTime:
                              type: string
                              format: date-time

  # ---------- Dashboard ----------
  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: 首页汇总数据
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DashboardSummary'

  /dashboard/trend:
    get:
      tags: [Dashboard]
      summary: 首页趋势数据
      security: [{BearerAuth: []}]
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 7
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                            avgScore:
                              type: integer
                            avgTemperature:
                              type: number
